# Netlify configuration for AAA HyperKernel.
# Static site served from the repo root; serverless functions under netlify/functions.
[build]
  publish = "."

[functions]
  node_bundler = "esbuild"
  directory = "netlify/functions"

# Friendly routes -> functions (functions also self-declare these via `config.path`).
[[redirects]]
  from = "/api/vision"
  to = "/.netlify/functions/vision"
  status = 200

[[redirects]]
  from = "/api/sync"
  to = "/.netlify/functions/sync"
  status = 200

[[redirects]]
  from = "/api/claude"
  to = "/.netlify/functions/claude"
  status = 200

[[redirects]]
  from = "/api/openai"
  to = "/.netlify/functions/openai"
  status = 200

[[redirects]]
  from = "/api/transcribe"
  to = "/.netlify/functions/transcribe"
  status = 200

[[redirects]]
  from = "/api/research"
  to = "/.netlify/functions/research"
  status = 200

# The current app includes inline boot code and styles. Keep script CSP in
# report-only mode until those legacy paths have been extracted and exercised.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "object-src 'none'; base-uri 'self'; frame-ancestors 'none'"
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' https: wss:; media-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"
