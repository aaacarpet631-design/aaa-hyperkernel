name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      # Only the lint toolchain is needed here.
      - name: Install dev dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint

  test:
    name: Unit + integrity + boot smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      # The core suite is zero-dependency: no install needed.
      - name: Run test suite
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.log
      # Publish the totals to the run summary so the evidence is publicly
      # visible on the run page (job logs require sign-in even on public repos).
      - name: Publish test totals to the run summary
        if: always()
        run: |
          {
            echo '## Test totals'
            grep -E '^TOTAL:|^ALL GREEN$|^ALL PASSED$' test-output.log || echo 'totals not found — check the job log'
          } >> "$GITHUB_STEP_SUMMARY"

  netlify-build:
    name: Netlify build (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      # Function bundling needs the runtime dependencies installed.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      # Verifies netlify.toml is valid and every function bundles.
      # --offline keeps it self-contained: no site link or auth token needed.
      - name: Verify Netlify build
        run: npm run build:check

  rules:
    name: Firestore rules (emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Install rules test deps
        working-directory: test/rules
        run: npm install
      - name: Run Firestore rules tests (emulator)
        working-directory: test/rules
        run: npx firebase emulators:exec --only firestore "npm test"

  security:
    name: CodeQL security scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          output: sarif-results
          upload: false
      - name: Gate endpoint and high severity findings
        run: node test/static/security-gate.cjs sarif-results
